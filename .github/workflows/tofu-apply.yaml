name: Tofu Apply

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: tofu-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: homelab-runners

    steps:
      - name: checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup opentofu
        id: setup-opentofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "v1.13.9"
          # The wrapper shells out via `env node`, but our self-hosted runner
          # has no system Node on PATH. We don't read step outputs, so disable it.
          tofu_wrapper: false

      - name: configure aws credentials
        id: configure-aws-credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}

      - name: tofu init
        id: tofu-init
        run: tofu init -input=false

      # The R/W Hetzner token goes only to the steps that run tofu with providers,
      # not to the third-party actions above. -lock-timeout: wait for a lock held by
      # someone else (e.g. a local plan) instead of failing the merge-time apply.
      - name: tofu plan
        id: tofu-plan
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: tofu plan -input=false -lock-timeout=5m -out tfplan

      # The Storage Box holds the NAS's only off-site backup. delete_protection doesn't
      # stop tofu (the provider turns it off before deleting) and prevent_destroy vanishes
      # with its resource block, so refuse any plan that destroys or replaces a box.
      # To remove one on purpose, delete it by hand in the Hetzner Console first.
      - name: refuse storage box deletion
        id: guard
        run: |
          if tofu show -no-color tfplan | grep -E '^\s*# hcloud_storage_box\.[^ ]+ (will be destroyed|must be replaced)'; then
            echo "::error::This plan destroys or replaces a Storage Box. Refusing to apply."
            exit 1
          fi

      - name: tofu apply
        id: tofu-apply
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: tofu apply -input=false -lock-timeout=5m -auto-approve tfplan
