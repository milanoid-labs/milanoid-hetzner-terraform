name: Lint

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: homelab-runners
    steps:
      - name: checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup-tofu
        id: setup-tofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "v1.13.9"
          # The wrapper shells out via `env node`, but our self-hosted runner
          # has no system Node on PATH. We don't read step outputs, so disable it.
          tofu_wrapper: false

      - name: tofu fmt
        id: tofu-fmt
        run: tofu fmt -check -recursive

      - name: tofu init
        id: tofu-init
        run: tofu init -backend=false -input=false

      - name: tofu validate
        id: tofu-val
        run: tofu validate

      - name: setup tflint
        id: setup-tflint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2

      - name: tflint
        id: tflint
        run: tflint
